name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  publication-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Python 3.10.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.10.12
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install the frozen environment
        run: make setup
      - name: Run publication tests
        run: make test
      - name: Check syntax and source distribution
        run: |
          .venv/bin/python -m compileall -q src scripts tests
          .venv/bin/python -m build --sdist
      - name: Test source distribution without Git metadata
        run: |
          archive_root="$(mktemp -d)"
          tar -xzf dist/sequential_capacity_probes-1.0.0.tar.gz -C "$archive_root"
          cd "$archive_root/sequential_capacity_probes-1.0.0"
          PYTHONPATH="$PWD/src" "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest
      - name: Check tracked-file hygiene
        run: git diff --check
