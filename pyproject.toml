[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sequential-capacity-probes"
version = "1.0.0"
description = "Official code for Sequential Capacity Probes at RecSys 2026"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  {name = "Aleksandr V. Petrov"},
  {name = "Praveen Chandar"},
  {name = "Paul Bennett"},
  {name = "Hugues Bouchard"},
  {name = "Mounia Lalmas"},
]
keywords = ["recommender systems", "sequential recommendation", "RecSys"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy==1.26.4",
  "pandas==2.3.3",
  "scipy==1.12.0",
  "torch==2.7.1",
  "pytorch-lightning==2.5.6",
  "rectools==0.13.0",
  "PyYAML==6.0.2",
  "requests==2.34.2",
  "fastparquet==2026.5.0",
]

[project.optional-dependencies]
test = [
  "pytest==9.0.3",
  "build==1.3.0",
  "packaging==26.3",
  "tomli==2.4.1",
]

[project.urls]
Homepage = "https://github.com/spotify-research/sequential-capacity-probes"
Repository = "https://github.com/spotify-research/sequential-capacity-probes.git"
Issues = "https://github.com/spotify-research/sequential-capacity-probes/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
